aid: carolina-biooncology-institute
name: Carolina BioOncology Institute
description: >-
  Carolina BioOncology Institute (CBOI) is a physician-owned Phase I oncology clinical
  research clinic and translational laboratory in Huntersville, North Carolina, founded by
  Dr. John Powderly II. It runs first-in-human and early-phase immunotherapy trials for
  patients with advanced solid tumors, having opened more than 100 oncology trials over
  fifteen years, and operates the Human Applications Lab — a cGMP-capable cell-processing
  and biorepository facility developing autologous cellular therapies — alongside
  research-use-only analytical and clinical lab analysis services for trial sponsors.
  CBOI is the parent company of BioCytics and an openEHR Industry Partner. It publishes no
  public API, developer portal, SDK or machine-readable contract; the only machine-readable
  surface on its domain is the stock WordPress REST API its CMS emits, which is not a
  product API and is deliberately not registered here.
